<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>비상장사 투자 가이드 (Investment Pod)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Layout: sticky control bar, left contents rail, contract sections with clause rows (term | analysis), footnotes at the end. */
:root {
  --paper: #f3f5f7;
  --sheet: #ffffff;
  --ink: #142033;
  --muted: #5a6577;
  --line: #d7dce3;
  --accent: #c8530a;
  --accent-soft: #fdeee3;
  --req: #b3261e; --req-soft: #fbe9e7;
  --rec: #9a5b00; --rec-soft: #fdf1dc;
  --opt: #5d6878; --opt-soft: #eceff3;
  --edit: #3a4fc4; --edit-soft: #eaedfb;
  --model-bg: #f6f8fa;
  --font-display: "IBM Plex Serif", "IBM Plex Sans KR", Georgia, serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f141b; --sheet: #161d27; --ink: #e6ebf1; --muted: #9aa6b6; --line: #2a3441;
    --accent: #ff9a52; --accent-soft: #3a2416;
    --req: #ff8a80; --req-soft: #3a1d1c; --rec: #f2b45c; --rec-soft: #35290f; --opt: #a5b0bf; --opt-soft: #222b36;
    --edit: #9fb0ff; --edit-soft: #1d2340;
    --model-bg: #111821; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f141b; --sheet: #161d27; --ink: #e6ebf1; --muted: #9aa6b6; --line: #2a3441;
  --accent: #ff9a52; --accent-soft: #3a2416;
  --req: #ff8a80; --req-soft: #3a1d1c; --rec: #f2b45c; --rec-soft: #35290f; --opt: #a5b0bf; --opt-soft: #222b36;
  --edit: #9fb0ff; --edit-soft: #1d2340;
  --model-bg: #111821; color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-padding-top: 150px; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
h1, h2, h3 { text-wrap: balance; margin: 0; word-break: keep-all; }
body { word-break: keep-all; }
a { color: var(--accent); }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.bar { position: sticky; top: 0; z-index: 10; background: var(--paper); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 1320px; margin: 0 auto; padding: 12px 20px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.brand { display: flex; flex-direction: column; min-width: 220px; flex: 1 1 240px; }
.brand h1 { font-family: var(--font-display); font-weight: 600; font-size: 21px; letter-spacing: -0.01em; }
.brand p { margin: 0; color: var(--muted); font-size: 13px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--sheet); }
.seg button { border: 0; background: transparent; padding: 6px 11px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.search { flex: 1 1 240px; min-width: 200px; }
.search { position: relative; }
.search-row { display: flex; align-items: center; gap: 6px; }
.search-row input { flex: 1 1 auto; min-width: 0; }
.sr-nav { display: inline-flex; align-items: center; gap: 2px; font-size: 12.5px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.sr-nav button { border: 1px solid var(--line); background: var(--sheet); border-radius: 6px; width: 26px; height: 26px; cursor: pointer; font-size: 10px; color: var(--muted); }
.sr-nav button:hover { color: var(--accent); border-color: var(--accent); }
.sr-panel { position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 30; background: var(--sheet); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgba(20,32,51,.14); max-height: min(60vh, 520px); overflow: auto; padding: 6px; }
.sr-head { font-size: 12px; color: var(--muted); padding: 4px 8px 6px; display: flex; justify-content: space-between; }
.sr-head button { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 12px; }
.sr-item { display: block; width: 100%; text-align: left; border: 0; background: transparent; border-radius: 8px; padding: 8px 10px; cursor: pointer; color: var(--ink); }
.sr-item:hover, .sr-item.on { background: var(--accent-soft); }
.sr-path { font-size: 12px; color: var(--accent); font-weight: 600; display: block; }
.sr-snip { font-size: 13px; color: var(--muted); display: block; margin-top: 2px; }
.sr-snip b { color: var(--ink); background: color-mix(in srgb, var(--rec) 28%, transparent); font-weight: 600; border-radius: 2px; }
.sr-empty { padding: 10px; font-size: 13px; color: var(--muted); }
mark.cur { outline: 2px solid var(--accent); background: color-mix(in srgb, var(--accent) 30%, transparent); }
.search input { width: 100%; padding: 7px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--sheet); font-size: 14px; }
.ghost { border: 1px solid var(--line); background: var(--sheet); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
.ghost:hover, .seg button:not([aria-pressed="true"]):hover { color: var(--ink); }
.btn-edit { border: 1px solid var(--edit); color: var(--edit); background: var(--sheet); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 13px; font-weight: 600; }
.btn-edit[aria-pressed="true"] { background: var(--edit); color: #fff; }
.editbar { background: var(--edit-soft); color: var(--edit); border-top: 1px solid var(--line); font-size: 13px; }
.editbar .bar-in { padding: 7px 20px; gap: 6px 16px; }
.editbar b { font-weight: 600; }
.save-state { margin-left: auto; font-variant-numeric: tabular-nums; }

.wrap { max-width: 1200px; margin: 0 auto; padding: 28px 20px 64px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 32px; }
.logo { display: inline-flex; align-items: center; justify-content: center; height: 34px; min-width: 34px; margin-right: 22px; padding-right: 22px; border-right: 1px solid var(--line); border-radius: 0; text-decoration: none; border-radius: 6px; flex: none; }
.logo img { height: 32px; width: auto; display: block; }
.logo .lg-dark { display: none; }
:root[data-theme="dark"] .logo .lg-light { display: none; }
:root[data-theme="dark"] .logo .lg-dark { display: block; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .logo .lg-light { display: none; } :root:not([data-theme="light"]) .logo .lg-dark { display: block; } }
.logo .ph { font-family: var(--font-body); font-weight: 700; font-size: 15px; letter-spacing: .02em; color: var(--accent); border: 1.5px dashed var(--accent); border-radius: 6px; padding: 3px 8px; }
.brand { flex-direction: row !important; align-items: center; }
.to-top { cursor: pointer; }
.money-layer { position: fixed; inset: 0; pointer-events: none; z-index: 9999; overflow: hidden; }
.money { position: absolute; left: 0; top: 0; will-change: transform, opacity; }
.money.bill { width: 46px; height: 22px; border-radius: 3px; background: linear-gradient(135deg, #7fc98f, #3f9a5a); border: 1.5px solid #2e7a45; box-shadow: inset 0 0 0 3px rgba(255,255,255,.25), 0 2px 4px rgba(0,0,0,.18); color: #1d5530; font: 700 12px/19px var(--font-body, sans-serif); text-align: center; }
.money.bill.b2 { background: linear-gradient(135deg, #f3c58a, #d98c3a); border-color: #b36d24; color: #6e3e0c; }
.money.coin { width: 20px; height: 20px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff3b0, #f1b52c 55%, #c4840c); border: 1.5px solid #a86f08; box-shadow: 0 2px 3px rgba(0,0,0,.2); color: #7a4f00; font: 700 11px/17px var(--font-body, sans-serif); text-align: center; }
.editing .to-top { cursor: text; }
.secnav { border-top: 1px solid var(--line); }
.secnav-in { max-width: 1200px; margin: 0 auto; padding: 6px 20px; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: thin; }
.secnav a { white-space: nowrap; padding: 6px 12px; border-radius: 99px; font-size: 13.5px; font-weight: 500; color: var(--muted); text-decoration: none; }
.secnav a:hover { color: var(--ink); background: var(--accent-soft); }
.secnav a.on { color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.secnav .sep { width: 1px; background: var(--line); margin: 6px 6px; flex: none; }
nav.toc { position: sticky; top: 120px; align-self: start; max-height: calc(100vh - 140px); overflow: auto; font-size: 13.5px; }
nav.toc h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-family: var(--font-body); margin-bottom: 8px; }
nav.toc ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
nav.toc a { display: grid; grid-template-columns: 38px 1fr; gap: 6px; padding: 5px 8px; border-radius: 6px; text-decoration: none; color: var(--ink); }
nav.toc a:hover { background: var(--accent-soft); }
nav.toc .code { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); padding-top: 2px; }
nav.toc .grp { font-size: 11.5px; color: var(--muted); padding: 10px 8px 2px; }
main { min-width: 0; display: grid; gap: 40px; }
main > *, #contracts > *, .c-body > *, .c-meta > *, .pair > * { min-width: 0; }
.bar-in > * { min-width: 0; }
.card, .box, .jn, .model, .c-sum, .lead { overflow-wrap: break-word; }
.dl button { white-space: nowrap; }

.sec-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin-bottom: 6px; }
.sec-h h2 { font-family: var(--font-display); font-weight: 600; font-size: 24px; }
.lead { color: var(--muted); max-width: 72ch; margin: 0 0 16px; }

.assume { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
.card { background: var(--sheet); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px 14px 18px; position: relative; display: grid; gap: 6px; align-content: start; }
.card::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 4px; border-radius: 0 3px 3px 0; background: var(--rec); }
.card.high::before { background: var(--req); }
.card h3 { font-size: 15px; font-weight: 600; display: flex; gap: 8px; align-items: baseline; }
.card p { margin: 0; font-size: 14px; }
.card .act { font-size: 13.5px; color: var(--accent); }
.card .act b { font-weight: 600; }
.sev { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 99px; white-space: nowrap; background: var(--rec-soft); color: var(--rec); }
.sev.high { background: var(--req-soft); color: var(--req); }

.tbl-wrap { overflow-x: auto; background: var(--sheet); border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 9px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { font-size: 12.5px; color: var(--muted); font-weight: 600; background: var(--model-bg); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.c { text-align: center; white-space: nowrap; font-variant-numeric: tabular-nums; }
td.c.on { color: var(--accent); font-weight: 700; }
th.sel, td.sel { background: var(--accent-soft); }
.jt td { min-width: 170px; font-size: 13.5px; }
.jt td:first-child { min-width: 130px; font-weight: 600; }

.contract { background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.c-head { padding: 18px 20px 16px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
.c-title { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; }
.c-title .code { font-family: var(--font-mono); font-size: 12px; color: var(--accent); border: 1px solid var(--accent); border-radius: 4px; padding: 0 6px; }
.c-title h2 { font-family: var(--font-display); font-size: 21px; font-weight: 600; }
.c-title .alt { color: var(--muted); font-size: 13.5px; }
.jchip { font-size: 11px; padding: 1px 7px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); font-weight: 600; font-family: var(--font-mono); }
.c-sum { margin: 0; max-width: 80ch; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px 20px; font-size: 13px; margin: 0; }
.facts div { display: grid; gap: 1px; }
.facts dt { color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; }
.facts dd { margin: 0; }
.count { font-size: 12.5px; color: var(--muted); }
.basis { font-size: 12.5px; color: var(--muted); }

.clause { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 16px 24px; padding: 16px 20px; border-top: 1px solid var(--line); }
.c-meta { display: grid; gap: 4px; align-content: start; }
.c-meta .nm { font-weight: 600; font-size: 15px; line-height: 1.4; }
.c-meta .term { font-size: 12.5px; color: var(--muted); }
.pill { justify-self: start; font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 99px; border: 0; }
.pill.R { background: var(--req-soft); color: var(--req); }
.pill.C { background: var(--rec-soft); color: var(--rec); }
.pill.O { background: var(--opt-soft); color: var(--opt); }
button.pill { cursor: pointer; }
.c-body { display: grid; gap: 10px; min-width: 0; }
.c-body .def { margin: 0; }
.c-body .def > b { font-weight: 600; margin-right: 6px; color: var(--muted); font-size: 12.5px; }
.pair { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 12px; }
.box { border-radius: 8px; padding: 10px 12px; font-size: 14px; }
.box h4 { margin: 0 0 3px; font-size: 12px; font-weight: 600; letter-spacing: .02em; }
.box p { margin: 0; }
.box.must { background: var(--accent-soft); }
.box.must h4 { color: var(--accent); }
.box.flag { background: var(--req-soft); }
.box.flag h4 { color: var(--req); }
.flag-more { margin: 8px 0 0; padding: 8px 0 0 18px; border-top: 1px dashed color-mix(in srgb, var(--req) 35%, transparent); display: grid; gap: 4px; font-size: 13.5px; }
.flag-more li::marker { color: var(--req); }
.fm-lab { margin-top: 8px; font-size: 11px; font-weight: 600; color: var(--req); }
.fm-edit { white-space: pre-line; font-size: 13.5px; }
.model { border-left: 3px solid var(--accent); background: var(--model-bg); padding: 8px 12px; font-size: 13.5px; border-radius: 0 6px 6px 0; }
.model h4 { margin: 0 0 2px; font-size: 12px; color: var(--muted); font-weight: 600; }
.model p { margin: 0; font-family: var(--font-display); }
.compact .pair, .compact .model { display: none; }
mark { background: color-mix(in srgb, var(--rec) 28%, transparent); color: inherit; border-radius: 2px; }
.empty { padding: 24px; text-align: center; color: var(--muted); background: var(--sheet); border: 1px dashed var(--line); border-radius: 10px; }
.legend { font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin: -4px 0 4px; }
.legend .pill { margin-right: 4px; }
sup.fn { font-size: 8.5px; line-height: 0; margin-left: 1px; opacity: .85; }
sup.fn a { text-decoration: none; font-family: var(--font-mono); padding: 0 1px; }
sup.fn a:hover { text-decoration: underline; }
.refs ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; font-size: 12px; }
.en-lab { display: block; font-size: 11px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; color: var(--accent); margin-bottom: 2px; }
.en-sub { margin-top: 6px !important; padding-top: 6px; border-top: 1px dashed color-mix(in srgb, var(--accent) 35%, transparent); font-size: 13px; color: var(--muted); }
.refs li { display: grid; grid-template-columns: 34px 1fr; gap: 6px; padding: 4px 6px; border-radius: 6px; }
.refs li:target { background: var(--rec-soft); }
.refs .n { font-family: var(--font-mono); color: var(--muted); font-size: 10.5px; padding-top: 2px; }
.refs a { word-break: break-word; }
.refs h3 { font-size: 13px; color: var(--muted); font-weight: 600; margin: 14px 0 4px; }
.refs .box-in { background: var(--sheet); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
footer { border-top: 1px solid var(--line); padding-top: 16px; font-size: 13px; color: var(--muted); max-width: 90ch; }
[hidden] { display: none !important; }

.dl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.dl button { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--accent); color: var(--accent); background: var(--sheet); border-radius: 8px; padding: 5px 11px; cursor: pointer; font-size: 13px; font-weight: 600; }
.dl button:hover { background: var(--accent-soft); }
.dl button svg { width: 14px; height: 14px; }
.dl .dl-msg { font-size: 12.5px; color: var(--muted); }
.flow td { vertical-align: middle; }
.flow .dl button { padding: 3px 9px; font-size: 12.5px; }
.sub-h { font-family: var(--font-display); font-size: 18px; font-weight: 600; margin: 24px 0 4px; }
.opt-link { color: var(--ink); text-decoration: none; border-bottom: 1px dotted var(--accent); }
.opt-link:hover { color: var(--accent); }
.clause:target { background: var(--rec-soft); }
.jn { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: 13.5px; display: grid; gap: 4px; }
.jn h4 { margin: 0; font-size: 12px; color: var(--muted); font-weight: 600; }
.jn div { display: grid; grid-template-columns: 64px 1fr; gap: 8px; }
.jn .jchip { justify-self: start; align-self: start; margin-top: 2px; }
/* Edit mode */
.editing [data-ek], .editing [data-ak] { outline: 1px dashed color-mix(in srgb, var(--edit) 55%, transparent); outline-offset: 2px; border-radius: 3px; cursor: text; }
.editing [data-ek]:focus, .editing [data-ak]:focus { outline: 2px solid var(--edit); background: var(--sheet); }
.editing [data-ek]:empty::before, .editing [data-ak]:empty::before { content: attr(data-ph); color: var(--muted); }
.edited-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--edit); margin-left: 6px; vertical-align: middle; }
.etools { display: none; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.editing .etools { display: flex; }
.etools button { font-size: 11.5px; border: 1px solid var(--line); background: var(--sheet); border-radius: 6px; padding: 2px 8px; cursor: pointer; color: var(--muted); }
.etools button:hover { color: var(--edit); border-color: var(--edit); }
.tag-new { font-size: 11px; font-weight: 600; color: var(--edit); background: var(--edit-soft); border-radius: 99px; padding: 1px 7px; justify-self: start; }
.clause.hiddenc, tr.hiddenc { opacity: .45; }
.add-row { display: none; padding: 12px 20px; border-top: 1px dashed var(--line); }
.editing .add-row { display: block; }
.add-row button { border: 1px dashed var(--edit); color: var(--edit); background: transparent; border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
.model.placeholder { display: none; }
.editing .model.placeholder { display: block; opacity: .75; }

@media (max-width: 980px) {
  .wrap { grid-template-columns: minmax(0, 1fr); }
  nav.toc { position: static; max-height: none; border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: var(--sheet); }
  nav.toc ol { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
}
@media (max-width: 680px) {
  .bar { position: sticky; }
  .bar-in { padding: 8px 14px; gap: 8px; }
  .brand { flex: 1 1 100%; }
  .brand h1 { font-size: 16px; line-height: 1.3; }
  .logo img { height: 24px; }
  .logo { margin-right: 12px; padding-right: 12px; }
  .controls { flex: 0 0 auto; }
  .search { flex: 1 1 140px; min-width: 0; }
  .ghost, .btn-edit { padding: 6px 9px; font-size: 12.5px; }
  .secnav-in { padding: 4px 10px; }
  .secnav a { padding: 5px 10px; font-size: 13px; }
  html { scroll-padding-top: 150px; }
  .assume { grid-template-columns: minmax(0, 1fr); }
  .sec-h h2 { font-size: 20px; }
  .c-title h2 { font-size: 18px; }
  .facts { grid-template-columns: minmax(0, 1fr); }
  .jn div { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .jt td { min-width: 140px; }
  table.stack thead { display: none; }
  table.stack, table.stack tbody, table.stack tr, table.stack td { display: block; width: 100%; }
  table.stack tr { padding: 12px 14px; border-bottom: 1px solid var(--line); }
  table.stack tr:last-child { border-bottom: 0; }
  table.stack td { border: 0; padding: 2px 0; }
  table.stack td.doc { font-weight: 600; font-size: 15px; padding-bottom: 6px; }
  table.stack td[data-l]::before { content: attr(data-l) " · "; color: var(--muted); font-size: 12.5px; }
  table.stack .dl { margin-top: 8px; }

      colStage: "Stage", colBind: "Binding", colWho2: "Usually drafted by", colFile: "Sample form", dlKo: "Korean .docx", dlEn: "English .docx", dlFail: "Download unavailable: the file did not load or downloads are blocked in this view.", dlDeclined: "Download cancelled.", jn: "Jurisdiction notes" }

  if (window.GUIDE_SNAPSHOT) { edits = GUIDE_SNAPSHOT.edits || {}; added = GUIDE_SNAPSHOT.added || {}; }

    return text;
  }
  // editable span
  function ed(key, def, tag, cls, noAbbr) {

        var key = b.getAttribute("data-key"), def = b.getAttribute("data-def");
        var nxt = order[(order.indexOf(ev(key, def)) + 1) % 3];
        setEdit(key, nxt, def);
      }
      renderAll();
    } else if (act === "toggle-hide") {
      var hk = b.getAttribute("data-base") + "hidden";
      if (edits[hk]) setEdit(hk, "", ""); else setEdit(hk, "1", "");
      renderAll();
    } else if (act === "reset") {
      var base = b.getAttribute("data-base");
      Object.keys(edits).filter(function (k) { return k.indexOf(base) === 0; }).forEach(function (k) {
        delete edits[k];
        queue(k, function () { return db.collection("edits").doc(k).delete(); });
      });
      renderAll();
    } else if (act === "add-clause") {
      var cid = b.getAttribute("data-cid");
      var ref = db.collection("added").doc();
      var doc = { cid: cid, l: "R", name: { ko: X.ko.newName, en: X.en.newName }, def: { ko: "", en: "" }, must: { ko: "", en: "" }, flag: { ko: "", en: "" }, model: { ko: "", en: "" }, by: me || "", at: new Date().toISOString() };
      added[ref.id] = doc;
      queue("added-" + ref.id, function () { return ref.set(doc); });
      renderAll();
    } else if (act === "add-closing") {
      var cref = db.collection("added").doc();
      var cdoc = { cid: "__closing", cat: { ko: "분류", en: "" }, item: { ko: "새 항목", en: "" }, deal: { ko: "공통", en: "" }, who: { ko: "", en: "" }, note: { ko: "", en: "" }, by: me || "", at: new Date().toISOString() };
      added[cref.id] = cdoc;
      queue("added-" + cref.id, function () { return cref.set(cdoc); });
      renderAll();
    } else if (act === "del-added") {
      var aid = b.getAttribute("data-aid");
      delete added[aid];
      queue("added-" + aid, function () { return db.collection("added").doc(aid).delete(); });
      renderAll();
    }
  });
  document.getElementById("toggle-compact").addEventListener("click", function () { state.compact = !state.compact; renderAll(); });
  document.getElementById("toggle-edit").addEventListener("click", function () { state.editing = !state.editing; if (state.editing) state.compact = false; renderAll(); });
  var timer;
  document.getElementById("q").addEventListener("input", function (e) {
    clearTimeout(timer);
    var v = e.target.value.trim();
    timer = setTimeout(function () { state.q = v; renderAll(); buildResults(); }, 150);
  });

  /* ---------- Search result locations ---------- */
  var results = [], curIdx = -1;
  var panel = document.getElementById("sr-panel"), srNav = document.getElementById("sr-nav");
  function fieldLabel(m) {
    var box = m.closest(".box, .jn, .model, .en-sub");
    if (box) { var h = box.querySelector("h4, .en-lab"); return h ? h.textContent : ""; }
    if (m.closest(".def")) return "정의";
    if (m.closest(".c-sum")) return "개요";
    if (m.closest(".nm")) return "조항명";
    if (m.closest(".term")) return "영문 조항명";
    if (m.closest(".facts")) { var dd = m.closest(".facts > div"); var dt = dd && dd.querySelector("dt"); return dt ? dt.textContent : ""; }
    if (m.closest(".act")) return "조치";
    return "";
  }
  function locate(m) {
    var parts = [];
    var sec = m.closest("section");
    if (sec) { var h2 = sec.querySelector("h2"); if (h2) parts.push(h2.textContent.trim()); }
    var cl = m.closest(".clause");
    if (cl) { var nm = cl.querySelector(".nm"); if (nm) parts.push(nm.textContent.trim()); }
    var card = m.closest(".card");
    if (card) { var h3 = card.querySelector("h3 span:last-child"); if (h3) parts.push(h3.textContent.trim().replace(/\[\d+\]/g, "")); }
    var tr = m.closest("tr");
    if (tr && !cl) { var td = tr.querySelector("td"); if (td) parts.push(td.textContent.trim().slice(0, 30)); }
    var f = fieldLabel(m); if (f && parts[parts.length - 1] !== f) parts.push(f);
    return parts.filter(Boolean).join(" › ");
  }
  function snippet(m) {
    var host = m.closest("p, span[data-ek], td, h2, h3, .nm") || m.parentNode;
    var text = host.textContent.replace(/\s+/g, " ");
    var word = m.textContent, i = text.toLowerCase().indexOf(word.toLowerCase());
    if (i < 0) return esc(text.slice(0, 80));
    var a = Math.max(0, i - 28), b = Math.min(text.length, i + word.length + 40);
    return (a > 0 ? "…" : "") + esc(text.slice(a, i)) + "<b>" + esc(text.slice(i, i + word.length)) + "</b>" + esc(text.slice(i + word.length, b)) + (b < text.length ? "…" : "");
  }
  function buildResults() {
    results = []; curIdx = -1;
    if (!state.q || state.editing) { panel.hidden = true; srNav.hidden = true; return; }
    var seen = new Set();
    document.querySelectorAll("main mark").forEach(function (m) {
      var host = m.closest("p, span[data-ek], td, h2, h3, .nm, .term") || m.parentNode;
      if (seen.has(host)) return;
      seen.add(host);
      results.push({ el: m, path: locate(m), snip: snippet(m) });
    });
    srNav.hidden = !results.length;
    document.getElementById("sr-count").textContent = results.length ? "0/" + results.length : "";
    var h = '<div class="sr-head"><span>“' + esc(state.q) + '” ' + results.length + "곳</span><button type=\"button\" id=\"sr-close\">닫기</button></div>";
    if (!results.length) h += '<div class="sr-empty">' + esc(U("noResult")) + "</div>";
    h += results.slice(0, 60).map(function (r, i) {
      return '<button type="button" class="sr-item" data-sr="' + i + '"><span class="sr-path">' + esc(r.path) + '</span><span class="sr-snip">' + r.snip + "</span></button>";
    }).join("");
    if (results.length > 60) h += '<div class="sr-empty">상위 60곳만 표시합니다. 검색어를 더 구체적으로 입력하세요.</div>';
    panel.innerHTML = h;
    placePanel();
    panel.hidden = false;
  }
  function placePanel() {
    if (window.innerWidth <= 680) {
      var r = document.getElementById("search-box").getBoundingClientRect();
      panel.style.position = "fixed"; panel.style.left = "10px"; panel.style.right = "10px"; panel.style.top = (r.bottom + 6) + "px";
    } else { panel.style.position = ""; panel.style.left = ""; panel.style.right = ""; panel.style.top = ""; }
  }
  function goTo(i) {
    if (!results.length) return;
    curIdx = (i + results.length) % results.length;
    document.querySelectorAll("mark.cur").forEach(function (x) { x.classList.remove("cur"); });
    var r = results[curIdx];
    r.el.classList.add("cur");
    var top = r.el.getBoundingClientRect().top + window.scrollY - 170;
    window.scrollTo({ top: top, behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
    document.getElementById("sr-count").textContent = (curIdx + 1) + "/" + results.length;
    panel.querySelectorAll(".sr-item").forEach(function (b) { b.classList.toggle("on", +b.getAttribute("data-sr") === curIdx); });
  }
  panel.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    if (b.id === "sr-close") { panel.hidden = true; return; }
    if (b.hasAttribute("data-sr")) { goTo(+b.getAttribute("data-sr")); panel.hidden = true; }
  });
  document.getElementById("sr-prev").addEventListener("click", function () { goTo(curIdx - 1); });
  document.getElementById("sr-next").addEventListener("click", function () { goTo(curIdx + 1); });
  document.getElementById("q").addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); clearTimeout(timer); state.q = e.target.value.trim(); if (!results.length || panel.hidden && curIdx < 0) { renderAll(); buildResults(); } goTo(e.shiftKey ? curIdx - 1 : curIdx + 1); panel.hidden = true; }
    if (e.key === "Escape") panel.hidden = true;
  });
  document.getElementById("q").addEventListener("focus", function () { if (state.q && results.length) { placePanel(); panel.hidden = false; } });
  document.addEventListener("click", function (e) { if (!e.target.closest("#search-box")) panel.hidden = true; });

  renderAll();
  var spyT;
  window.addEventListener("scroll", function () {
    clearTimeout(spyT);
    spyT = setTimeout(function () {
      var links = document.querySelectorAll("#secnav a"), cur = null, y = 170;
      links.forEach(function (a) { var el = document.getElementById(a.getAttribute("data-sec")); if (el && el.getBoundingClientRect().top <= y) cur = a; });
      links.forEach(function (a) { a.classList.toggle("on", a === cur); });
    }, 60);
  }, { passive: true });

  /* ---------- Shared store ---------- */
  if (window.claude && typeof window.claude.use === "function") {
    Promise.all([window.claude.use("db"), window.claude.use("user")]).then(function (res) {
      db = res[0];
      var user = res[1];
      if (!db) return;
      var slow = setTimeout(function () { status(V("loadSlow")); }, 10000);
      var gotE = false, gotA = false;
      db.collection("edits").onSnapshot(function (snap) {
        var m = {};
        snap.docs.forEach(function (d) { if (d.exists) { var x = d.data(); if (x && typeof x.v !== "undefined") m[d.id] = { v: x.v, by: x.by, at: x.at }; } });
        edits = m;
        if (!snap.metadata.fromCache) { gotE = true; if (gotA) { clearTimeout(slow); if (saveEl.textContent === V("loadSlow")) status(""); } }
        safeRender();
      }, function (err) { clearTimeout(slow); console.warn(err); });
      db.collection("added").onSnapshot(function (snap) {
        var m = {};
        snap.docs.forEach(function (d) { if (d.exists) m[d.id] = JSON.parse(JSON.stringify(d.data())); });
        added = m;
        if (!snap.metadata.fromCache) { gotA = true; if (gotE) clearTimeout(slow); }
        safeRender();
      }, function (err) { console.warn(err); });
      Promise.resolve(user ? user.canEdit() : null).then(function (can) {
        var btn = document.getElementById("toggle-edit");
        btn.hidden = can === false;
      }).catch(function () { document.getElementById("toggle-edit").hidden = false; });
      if (user && user.id) Promise.resolve(user.id()).then(function (id) { me = id; }).catch(function () {});
      renderAll();
    }).catch(function () {});
  }
})();
</script>
</body>
</html>
